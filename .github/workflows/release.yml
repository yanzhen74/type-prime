name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & test & build
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Build standalone release
        run: npm run build:release

      - name: Package zip
        run: |
          cd release
          zip -r "../type-prime-${GITHUB_REF_NAME}-standalone.zip" type-prime-standalone.html
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/type-prime-standalone.html
            type-prime-${{ github.ref_name }}-standalone.zip
          generate_release_notes: true
